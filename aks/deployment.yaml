apiVersion: apps/v1
kind: Deployment
metadata:
  name: loganalytics-app
  labels:
    app: loganalytics-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loganalytics-app
  template:
    metadata:
      labels:
        app: loganalytics-app
    spec:
      containers:
      - name: loganalytics-app
        image: <your-acr-name>.azurecr.io/loganalytics-app:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
        envFrom:
        - secretRef:
            name: loganalytics-app-secret # Ensure you create this secret with your .env vars in AKS
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "768Mi"
            cpu: "1000m"

---
apiVersion: v1
kind: Service
metadata:
  name: loganalytics-app-svc
spec:
  selector:
    app: loganalytics-app
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    appProtocol: http

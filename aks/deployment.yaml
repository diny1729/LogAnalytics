apiVersion: apps/v1
kind: Deployment
metadata:
  name: loganalytics-app
  labels:
    app: loganalytics-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: loganalytics-app
  template:
    metadata:
      labels:
        app: loganalytics-app
    spec:
      containers:
      - name: loganalytics-app
        image: <your-acr-name>.azurecr.io/loganalytics-app:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        envFrom:
        - secretRef:
            name: loganalytics-app-secret # Ensure you create this secret with your .env vars in AKS
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: loganalytics-app-svc
spec:
  selector:
    app: loganalytics-app
  ports:
  - port: 8080
    targetPort: 8080

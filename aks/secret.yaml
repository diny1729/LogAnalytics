apiVersion: v1
kind: Secret
metadata:
  name: loganalytics-app-secret
type: Opaque
stringData:
  # The values here will be injected as environment variables into the container.
  # Do not commit the actual sensitive values to source control.
  # Replace the placeholder values with your actual credentials before applying.
  
  # --- Server Configuration ---
  # The port the backend server listens on
  PORT: "8080"
  # Set to "production" to optimize the Node.js application
  NODE_ENV: "production"
  # Allowed origin for CORS (e.g. your application's public domain)
  CORS_ORIGIN: "http://localhost:5010,http://localhost:5173,http://localhost:8080,http://127.0.0.1:5010,*"
  
  # --- Log Analytics Workspaces (Multi-Subscription Support) ---
  # Default fallback workspace ID the backend will query against if none selected
  LOG_ANALYTICS_WORKSPACE_ID: "11111111-1111-1111-1111-111111111111"
  # Allow the client to specify a different workspace ID than the default
  ALLOW_WORKSPACE_OVERRIDE: "true"
  
  # Multiple Log Analytics Workspaces organized by Azure Subscription for the UI dropdown selector.
  # Format: SubscriptionName/WorkspaceName:WorkspaceCustomerId (comma-separated)
  # Example: "Production/EastUS-Logs:11111111-1111-1111-1111-111111111111,Production/WestEurope-Logs:22222222-2222-2222-2222-222222222222,Staging/Staging-Logs:33333333-3333-3333-3333-333333333333,Security/Sentinel-Logs:44444444-4444-4444-4444-444444444444"
  VITE_WORKSPACES: "Production/EAST-US-2:11111111-1111-1111-1111-111111111111,Production/NorthEurope:22222222-2222-2222-2222-222222222222,Staging/Staging-Logs:33333333-3333-3333-3333-333333333333,Security/Sentinel-Logs:44444444-4444-4444-4444-444444444444"
  
  # Require Azure AD MSAL Authentication (set to "true" to show login screen & enforce AD security groups)
  VITE_REQUIRE_AZURE_AD_AUTH: "true"
  # Restrict Azure AD Login to specific AD Security Groups (comma-separated Group Object IDs or names). Leave empty to allow all AD users.
  VITE_ALLOWED_AZURE_AD_GROUPS: ""
  # Maximum time in milliseconds before a query times out
  QUERY_TIMEOUT_MS: "30000"
  # Maximum number of rows returned by a query
  QUERY_MAX_ROWS: "5000"
  # Maximum length of the KQL query string allowed
  QUERY_MAX_LENGTH: "20000"
  
  # --- Rate Limiting Configuration ---
  # Time window for rate limiting in milliseconds
  RATE_LIMIT_WINDOW_MS: "60000"
  # Maximum number of requests allowed within the rate limit window per IP
  RATE_LIMIT_MAX: "300"
  
  # --- Azure Backend Authentication (Service Principal) ---
  # The Tenant ID for backend server authentication
  AZURE_TENANT_ID: "your-azure-tenant-id"
  # The Client ID (App Registration) for backend server authentication
  AZURE_CLIENT_ID: "your-azure-client-id"
  # The Client Secret for backend server authentication
  AZURE_CLIENT_SECRET: "your-azure-client-secret"
  
  # --- Azure OpenAI Integration ---
  # API key for connecting to Azure OpenAI
  AZURE_OPENAI_API_KEY: "your_api_key_here"
  # Endpoint URL for your Azure OpenAI resource
  AZURE_OPENAI_ENDPOINT: "https://your-resource-name.openai.azure.com/"
  # The deployment name of your GPT model in Azure OpenAI
  AZURE_OPENAI_DEPLOYMENT: "gpt-4o"
  
  # --- Redis Cache Configuration (1GB Pod / ClusterIP) ---
  # Hostname of Redis service (defaults to redis-logapp-svc when deployed in AKS)
  REDIS_HOST: "redis-logapp-svc"
  # Port for Redis service
  REDIS_PORT: "6379"
  # Optional Redis password (leave empty if no password is set)
  REDIS_PASSWORD: ""
  # Optional full Redis connection URL (e.g. redis://:password@redis-logapp-svc:6379)
  REDIS_URL: ""
  # Cache TTL in seconds (default: 300 = 5 minutes)
  REDIS_CACHE_TTL_SECONDS: "300"
  # Enable or disable Redis caching (true/false)
  REDIS_ENABLED: "true"

  # --- Frontend Client Authentication (MSAL SPA) ---
  # These are exposed to the Vite frontend during build (if built with them) 
  # or can be injected at runtime depending on your frontend setup.
  # Client ID for the SPA App Registration used by the browser
  VITE_AZURE_CLIENT_ID: "your-spa-client-id"
  # Tenant ID for the SPA App Registration used by the browser
  VITE_AZURE_TENANT_ID: "your-tenant-id"
